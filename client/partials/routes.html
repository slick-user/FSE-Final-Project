<div class="space-y-6">

    <div class="flex justify-between items-center">
      <h2 class="text-3xl font-bold">Manage Routes</h2>
  
      <button 
        hx-get="/admin/routes/add-form"
        hx-target="#route-modal-content"
        onclick="openRouteModal()"
        class="bg-fastBlue text-white px-4 py-2 rounded hover:bg-blue-700"
      >
        + Add Route
      </button>
    </div>
  
    <!-- ROUTES TABLE -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
      <table class="min-w-full">
        <thead class="bg-gray-800 text-white">
          <tr>
            <th class="px-4 py-2">Route</th>
            <th class="px-4 py-2">Zone</th>
            <th class="px-4 py-2">Actions</th>
          </tr>
        </thead>
  
        <tbody>
          <!-- Example rows -->
          <tr class="border-b">
            <td class="px-4 py-2">G-9 Stop</td>
            <td class="px-4 py-2">Islamabad</td>
            <td class="px-4 py-2 space-x-3">
  
              <button 
                hx-get="/admin/routes/edit/1"
                hx-target="#route-modal-content"
                onclick="openRouteModal()"
                class="text-blue-600 hover:text-blue-800"
              >Edit</button>
  
              <button 
                hx-delete="/admin/routes/delete/1"
                hx-target="closest tr"
                hx-swap="outerHTML swap:1s"
                class="text-red-600 hover:text-red-800"
              >Delete</button>
  
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
  </div>
