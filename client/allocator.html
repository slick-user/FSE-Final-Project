    <style>
      /* Styling for the map placeholder to match the image structure */
      .map-placeholder {
        min-height: 400px;
        background-color: #e5e7eb; 
        border: 1px solid #d1d5db;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 500;
        color: #4b5563;
      }
        /* Style for the 'Bus Found' result banner with background image and gradient */
      .bus-found-banner {
          position: relative; /* Needed for absolute positioning of overlay */
          color: white;
          text-align: center;
          padding: 4rem 1.5rem;
          border-radius: 0.75rem;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.08); /* Darker shadow for contrast */
          transition: opacity 0.3s ease-in-out;
          
          background-image: url('static/images/Hero\ Image.png'); /* Placeholder bus image */
          background-size: cover;
          background-position: center;
          display: flex; /* Use flex to easily center content vertically */
          flex-direction: column;
          justify-content: center; /* Center content vertically */
          align-items: center; /* Center content horizontally */
          min-height: 400px; /* Give it some height */
      }

      /* Gradient overlay for the bus found banner */
      .bus-found-banner::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7)); /* Darker gradient for text readability */
          z-index: 1; /* Puts gradient above image but below text */
      }

      /* Ensures text and buttons are above the gradient overlay */
      .bus-found-banner > * {
          position: relative;
          z-index: 2;
      }   

      .btn {
        position: relative;
        font-size: 17px;
        text-decoration: none;
        padding: 1em 2.5em;
        display: inline-block;
        cursor: pointer;
        border-radius: 6em;
        transition: all 0.2s;
        border: none;
        font-family: "Inter";
        font-weight: 500;
        color: black;
        background-color: white;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .btn:active {
        transform: translateY(-1px);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      }

      .btn::after {
        content: "";
        display: inline-block;
        height: 100%;
        width: 100%;
        border-radius: 100px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
        transition: all 0.4s;
      }
      
      .btn:hover::after {
        transform: scaleX(1.4) scaleY(1.6);
        opacity: 0;
      } 

    </style>
      
  </head>

  <body class="font-sans text-gray-800">

        <h2 class="text-4xl font-extrabold text-gray-800 mb-10 border-b pb-2">Enter Schedule</h2>

        <!-- This grid establishes the side-by-side layout (Form on left, Map on right) on large screens -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column (1/3 width): Schedule Input Form -->
            <div class="lg:col-span-1 bg-white p-8 shadow-2xl rounded-xl">
                <h3 class="text-xl font-semibold text-fastBlue mb-4">Find Bus</h3>

                <form onsubmit="handleFindBus(event)">
                  <!-- Stop Dropdown -->
                  <div class="mb-6">
                    <label for="stop-select" class="block text-sm font-medium text-gray-700 mb-1">Stop</label>
                    <select id="stop-select" name="stopId" required

                  <!-- Time of Departure -->

    <script>
      function toggleModal() {
        const modal = document.getElementById('auth-modal');
        if (modal) modal.classList.toggle('modal-open');
      }
      
      document.addEventListener("htmx:afterSwap", () => {
        setupAuthHandlers(); // Existing call for form binding
        updateAuthButton();  // NEW: Check auth status and update button
      });

      (function requireAuth() {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Please log in to access the Bus Allocator page.");
          window.location.href = "/index.html";
        }
      })();

      async function populateStops() {
        const res = await fetch('/api/stops');
        const stops = await res.json();
        const select = document.getElementById('stop-select');
        select.innerHTML = '';
        stops.forEach(stop => {
          const option = document.createElement('option');
          option.value = stop._id;
          option.textContent = `${stop.zone || 'Zone ?'} – ${stop.name}`;
          select.appendChild(option);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        setupAuthHandlers(); // Existing call for form binding
        updateAuthButton();  // NEW: Check auth status and update button
        populateStops();  // Add all the possible stops
        checkExistingReservation();
      });

      async function checkExistingReservation() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || !user._id) return;

        try {
          const res = await fetch(`/api/route/users/${user._id}/reservations`);
          const data = await res.json();
          if (data.reservedSeats && data.reservedSeats.length > 0) {
            // Show details to user
            const r = data.reservedSeats[0]; // or show a list if >1
            document.getElementById("bus-result-container").innerHTML =
              `<div class="bus-found-banner">
                <h3 class="text-3xl mb-2 text-white">Active Reservation</h3>
                <p class="mb-2 text-white">Bus Schedule: ${r.schedule.routeName || "(unknown)"}</p>
                <p class="mb-2 text-white">Seat Number: ${r.seatNumber}</p>
                <button class="btn bg-black text-white" onclick="cancelReservation('${r.schedule._id}', ${r.seatNumber})">Cancel Reservation</button>
              </div>`;
            // Hide reservation controls
            document.getElementById('seat-selection-container').style.display = 'none';
          }
        } catch (error) {
          console.error("Error checking reservation", error);
        }
      }

      function getUserIdFromToken(token) {
        try {
          if (!token) return null;
          const parts = token.split('.');
          if (parts.length !== 3) return null;

          // The payload is the second part (index 1) and is base64 encoded
          const encodedPayload = parts[1];
          
          // Use atob to decode the base64 string
          // NOTE: This is a browser function and won't work in Node.js
          const rawPayload = atob(encodedPayload);
          const payload = JSON.parse(rawPayload);

          // Assuming your server put the MongoDB ID in a field named 'id' or '_id' in the token payload
          return payload.id || payload._id || payload.sub; 

        } catch (e) {
          console.error("Failed to decode token:", e);
          return null;
        }
      }

      // Map Initialization (Starts at FAST University)
      const FAST_COORDS = [33.6426, 73.0394];
      const map = L.map('route-map').setView(FAST_COORDS, 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      let routeLayer = null;
      let busStopMarker = null;

      async function showRoute(stopId, requestedDepartureTime) {
        const res = await fetch(`/api/route?stopId=${stopId}&time=${requestedDepartureTime}`);
        if (!res.ok) {
          // Attempt to parse the response body, but use a generic error message if it fails
          const errorText = await res.text();
        
          document.getElementById('bus-result-container').innerHTML =
              `<div class="bus-found-banner" style="background-image: none; background-color: #ef4444;"> 
                  <h3 class="text-3xl font-extrabold text-white mb-4">Server Error</h3>
                  <p class="text-xl font-light text-white">The bus allocation server returned a ${res.status} error.</p>
                  <p class="text-sm font-light text-gray-200 mt-2">Check the backend service logs.</p>
              </div>`;
          if (routeLayer) map.removeLayer(routeLayer);
          return;
        }
        const data = await res.json();
        
        if (data.error || !data.bus_details) {
          document.getElementById('bus-result-container').innerHTML =
                    `<div class="bus-found-banner" style="background-image: none; background-color: #ef4444;"> 
                        <h3 class="text-3xl font-extrabold text-white mb-4">Allocation Error</h3>
                        <p class="text-xl font-light text-white">${data.message}</p>
                    </div>`;
          if (routeLayer) map.removeLayer(routeLayer);
          return;
        }
        
        const bus = data.bus_details;

        if (routeLayer) map.removeLayer(routeLayer);
        if (busStopMarker) map.removeLayer(busStopMarker);

        routeLayer = L.geoJSON(data.route).addTo(map);
        map.fitBounds(routeLayer.getBounds());

        // Add the destination marker
        const endCoords = data.route.features[0].geometry.coordinates.slice(-1)[0];
        busStopMarker = L.marker([endCoords[1], endCoords[0]]).addTo(map)
            .bindPopup(`<b>${data.stop.name}</b>`).openPopup();


        // 4. DYNAMIC BANNER RENDERING

        // Flag to determine styling
        const isToday = bus.is_today;

        const bannerTitle = isToday ? `${bus.route_name} Bus Allocated!` : 'Next Trip Suggested';
        const timeColor = 'text-fastGold';
        const departureTimeString = bus.departure_time;

        document.getElementById('bus-result-container').innerHTML =
            `<div class="bus-found-banner">
                <h3 class="text-3xl md:text-5xl font-extrabold text-white mb-4">${bannerTitle}</h3>
                
                <div class="mb-6 text-center">
                    <p class="text-xl md:text-2xl font-light mb-2 text-white">
                        <span class="font-bold">${bus.plate_number}</span> (${bus.model})
                    </p>
                    <p class="text-xl md:text-2xl font-light text-white">
                        Driver: ${bus.driver_name} · Seats: ${bus.capacity}
                    </p>
                </div>
                
                <p class="text-2xl md:text-4xl font-light mb-6">
                    ${bus.departure_message}
                    <span class="font-bold ${timeColor}"> ${departureTimeString}</span>
                </p>

                <div class="flex justify-center space-x-8 text-xl text-white font-semibold mb-8 border-t border-b border-gray-500 py-3">
                    <span>Distance: <span class="text-fastGold">${bus.distance_km} km</span></span>
                    <span>Travel Time: <span class="text-fastGold">${bus.travel_time_min} min</span></span>
                </div>

                <div class="flex flex-col md:flex-row justify-center space-y-4 md:space-y-0 md:space-x-6">
                    <button class="btn after:bg-white" onclick="document.getElementById('bus-result-container').innerHTML = ''; 
                                                               document.getElementById('seat-selection-container').style.display = 'none'">
                        <span class="top-key"></span>
                        <span class="text">Find Another Bus</span>
                        <span class="bottom-key-1"></span>
                        <span class="bottom-key-2"></span>
                    </button>
                    <button class="btn bg-black text-white after:bg-black"
                            data-schedule-id="${data._id}"
                            onclick="reserveSeat('${data._id}', getSelectedSeatNumber())">
                        <span class="top-key"></span>
                        <span class="text">Reserve Seat</span>
                        <span class="bottom-key-1"></span>
                        <span class="bottom-key-2"></span>
                    </button>
                </div>

              </div>`;

          document.getElementById('seat-selection-container').style.display = 'block';
          populateSeats(bus.capacity, bus.bookedSeats || 0);
        }

        async function handleFindBus(event) {
          event.preventDefault();
          const stopId = document.getElementById('stop-select').value;

          const time = document.getElementById('time').value;
          if (!stopId || !time) return alert('Select a stop and time first');
          await showRoute(stopId, time);
        }

        async function reserveSeat(scheduleId, seatNumber) {
          const user = JSON.parse(localStorage.getItem('user'));
          if (!user) return alert('Please login');
          if (!scheduleId) return alert('Missing schedule ID');
          if (typeof seatNumber !== 'number' || isNaN(seatNumber)) return alert('Select a seat!');
          try {
            const res = await fetch('/api/route/reserve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: user._id, scheduleId, seatNumber }),
            });
            let data;
            try { 
              data = await res.json();   // <-- assign to data OUTSIDE the catch
            } catch(parseError) {
              throw new Error(`Reservation response was not JSON`);
            } 

            // Save reservation so you can cancel later if needed.
            window.lastReservation = { scheduleId, seatNumber };

            if (res.ok && data.success) {
              alert(`Seat ${seatNumber} reserved successfully!`);
              // Disable controls
              document.querySelector('button.btn.bg-black.text-white').disabled = true;
              document.getElementById('seat-select').disabled = true;
              document.getElementById('seat-selection-container').style.display = 'none';
            } else {
              alert('Reservation failed: ' + (data.error || data.message));
            }
          } catch (error) {
            console.error(error);
            alert('Network or server error.');
          }
        }

        // Example: cancel reservation
        // Robust cancelReservation (use only the arguments!)
        async function cancelReservation(scheduleId, seatNumber) {
          const user = JSON.parse(localStorage.getItem('user'));
          if (!user) return alert('Please login');

          try {
            const res = await fetch('/api/route/reservations/cancel', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: user._id, scheduleId, seatNumber }),
            });
            const data = await res.json();
            if (data.success) {
              alert('Cancellation successful!');
              document.getElementById('bus-result-container').innerHTML = '';
              document.getElementById('seat-selection-container').style.display = 'none';
              // Optionally, re-check for reservations so user can book a new seat:
              setTimeout(checkExistingReservation, 250); // small delay to let backend update
            } else {
              alert('Cancel failed: ' + (data.error || data.message));
            }
          } catch (error) {
            alert('Cancellation request failed: ' + error.message);
          }
          // Always clear lastReservation after any attempt
          window.lastReservation = null;
        }

        // Display all reservations for current user
        async function showReservations() {
          const user = JSON.parse(localStorage.getItem('user'));
          if (!user) return alert('Please login');
          const res = await fetch(`/api/route/users/${user._id}/reservations`);
          const data = await res.json();
          if (data.reservedSeats) {
            // update your DOM to list seats & schedules
            console.log(data.reservedSeats);
          }
        }

        function populateSeats(busCapacity, bookedSeats) {
          const select = document.getElementById('seat-select');
          select.innerHTML = '';

          for (let i = 1; i <= busCapacity; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = `Seat ${i}`;
            if (i <= bookedSeats) option.disabled = true; // already booked
            select.appendChild(option);
          }
        }

        function getSelectedSeatNumber() {
          const select = document.getElementById('seat-select');
          return parseInt(select.value, 10); // Always a number
        }

    </script>

  </body>
