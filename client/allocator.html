<!DOCTYPE html>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              fastBlue: "#0055A4",
              fastGold: "#FFF714",
              fastCyan: "#00E0E0",
            },
          },
        },
      };
    </script>

    <style>
      /* Styling for the map placeholder to match the image structure */
      .map-placeholder {
        min-height: 400px;
        background-color: #e5e7eb; 
        border: 1px solid #d1d5db;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 500;
        color: #4b5563;
      }
        /* Style for the 'Bus Found' result banner with background image and gradient */
      .bus-found-banner {
          position: relative; /* Needed for absolute positioning of overlay */
          color: white;
          text-align: center;
          padding: 4rem 1.5rem;
          border-radius: 0.75rem;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.08); /* Darker shadow for contrast */
          transition: opacity 0.3s ease-in-out;
          
          background-image: url('static/images/Hero\ Image.png'); /* Placeholder bus image */
          background-size: cover;
          background-position: center;
          display: flex; /* Use flex to easily center content vertically */
          flex-direction: column;
          justify-content: center; /* Center content vertically */
          align-items: center; /* Center content horizontally */
          min-height: 400px; /* Give it some height */
      }

      /* Gradient overlay for the bus found banner */
      .bus-found-banner::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7)); /* Darker gradient for text readability */
          z-index: 1; /* Puts gradient above image but below text */
      }

      /* Ensures text and buttons are above the gradient overlay */
      .bus-found-banner > * {
          position: relative;
          z-index: 2;
      }   

      .btn {
        position: relative;
        font-size: 17px;
        text-decoration: none;
        padding: 1em 2.5em;
        display: inline-block;
        cursor: pointer;
        border-radius: 6em;
        transition: all 0.2s;
        border: none;
        font-family: "Inter";
        font-weight: 500;
        color: black;
        background-color: white;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .btn:active {
        transform: translateY(-1px);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      }

      .btn::after {
        content: "";
        display: inline-block;
        height: 100%;
        width: 100%;
        border-radius: 100px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
        transition: all 0.4s;
      }
      
      .btn:hover::after {
        transform: scaleX(1.4) scaleY(1.6);
        opacity: 0;
      } 

    </style>
      
  </head>

  <body class="font-sans text-gray-800">
   
    <!-- NAVBAR -->
    <header class="flex justify-between items-center px-8 py-4 bg-black text-white">
      
      <div class="flex items-center space-x-3">
        <img
          src="static/images/logo.png"
          alt="FAST Transport Logo"
          class="w-10 h-10 rounded-full"
        />
        <h1 class="text-2xl font-bold">FAST - UTBS</h1>
      </div>

      <nav class="space-x-6">
        <a href="index.html" class="hover:text-fastGold">Home</a>
        <a href="allocator.html" class="hover:text-fastGold">Bus Allocator</a>
        <a href="team.html" class="hover:text-fastGold">Meet The Team</a>
        <button 
          id="auth-button"
          class="bg-white text-black px-3 py-1 rounded hover:bg-fastGold transition"
          onclick="handleAuthClick()"
        > Login </button> 

      </nav>
    
    </header>

    <div hx-get="login.html" 
         hx-trigger="load" 
         hx-swap="outerHTML">
    </div>


    <!-- MAIN CONTENT AREA: Bus Allocator -->
    <main class="container mx-auto px-4 py-12 md:py-16" id="main-content">
        
        <h2 class="text-4xl font-extrabold text-gray-800 mb-10 border-b pb-2">Enter Schedule</h2>

        <!-- This grid establishes the side-by-side layout (Form on left, Map on right) on large screens -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column (1/3 width): Schedule Input Form -->
            <div class="lg:col-span-1 bg-white p-8 shadow-2xl rounded-xl">
                <h3 class="text-xl font-semibold text-fastBlue mb-4">Find Bus</h3>

                <form onsubmit="handleFindBus(event)">
                  <!-- Stop Dropdown -->
                  <div class="mb-6">
                    <label for="stop-select" class="block text-sm font-medium text-gray-700 mb-1">Stop</label>
                    <select id="stop-select" name="stopId" required
                            class="w-full p-3 border-2 border-gray-300 rounded-lg focus:ring-fastBlue
                                   focus:border-fastBlue transition-colors appearance-none">
                      <!-- populated via populateStops() -->
                    </select>
                  </div>
                
                  <!-- Time of Departure -->
                  <div class="mb-6">
                    <label for="time" class="block text-sm font-medium text-gray-700 mb-1">Time of Departure</label>
                    <input type="time" id="time" name="time" value="14:45" required
                           class="w-full p-3 border-2 border-gray-300 rounded-lg 
                                  focus:ring-fastBlue focus:border-fastBlue transition-colors">
                    <p class="text-xs text-gray-500 mt-1">When will you be departing?</p>
                  </div>
                
                  <!-- Confirm Button -->
                  <button type="submit"
                          class="w-full bg-black text-white py-3 rounded-xl 
                                 font-bold transition shadow-lg">
                    Confirm Details
                  </button>
                </form>
            </div>

            <!-- Map Grid/Div -->
            <div class="lg:col-span-2 bg-white shadow-2xl rounded-xl overflow-hidden border-2 border-gray-200">
                <div id="route-map" class="map-placeholder h-full p-6">
                    <div class="max-w-md">
                    </div>
                </div>
            </div>
        </div>
    </main>

        <!-- BOTTOM CONTAINER: BUS FOUND -->
        <!-- This static content is a placeholder and will be replaced by the HTMX response from the server -->
        <div id="bus-result-container" class="mt-12 opacity-100 transition-opacity">
            <div class="bus-found-banner">
                <h3 class="text-3xl md:text-5xl font-extrabold text-black mb-4">Bus Found</h3>
                <p class="text-xl md:text-2xl font-light mb-6 text-black">
                    G-9 Kashmir Highway Departing at <span class="font-bold">3:20 PM</span>
                </p>
                <div class="flex flex-col md:flex-row justify-center space-y-4 md:space-y-0 md:space-x-6">
                  <button class="btn after:bg-white">
                      <span class="top-key"></span>
                      <span class="text">Find Another Bus</span>
                      <span class="bottom-key-1"></span>
                      <span class="bottom-key-2"></span>
                  </button>
                  <button class="btn bg-black text-white after:bg-black">
                    <span class="top-key"></span>
                    <span class="text">Reserve Seat</span>
                    <span class="bottom-key-1"></span>
                    <span class="bottom-key-2"></span>
                  </button> 
                </div>
            </div>
        </div>

        © 2025 FAST University | Designed by

        <a href="https://fastubts.org" target="_blank" class="footer-link">fastubts.org</a>

    <script>
      function toggleModal() {
        const modal = document.getElementById('auth-modal');
        if (modal) modal.classList.toggle('modal-open');
      }
      
      document.addEventListener("htmx:afterSwap", () => {
        setupAuthHandlers(); // Existing call for form binding
        updateAuthButton();  // NEW: Check auth status and update button
      });

      (function requireAuth() {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Please log in to access the Bus Allocator page.");
          window.location.href = "/index.html";
        }
      })();

      async function populateStops() {
        const res = await fetch('/api/stops');
        const stops = await res.json();
        const select = document.getElementById('stop-select');
        select.innerHTML = '';
        stops.forEach(stop => {
          const option = document.createElement('option');
          option.value = stop._id;
          option.textContent = `${stop.zone || 'Zone ?'} – ${stop.name}`;
          select.appendChild(option);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        setupAuthHandlers(); // Existing call for form binding
        updateAuthButton();  // NEW: Check auth status and update button
        populateStops();  // Add all the possible stops
      });

      // Map Initialization (Starts at FAST University)
      const FAST_COORDS = [33.6426, 73.0394];
      const map = L.map('route-map').setView(FAST_COORDS, 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      let routeLayer = null;

      async function showRoute(stopId) {
        const res = await fetch(`/api/route?stopId=${stopId}`);
        if (!res.ok) {
          alert('Route lookup failed');
          return;
        }
        const data = await res.json();
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.geoJSON(data.route).addTo(map);
        map.fitBounds(routeLayer.getBounds());
        document.getElementById('bus-result-container').innerHTML =
          `<div class="bus-found-banner">
            <h3 class="text-3xl font-extrabold text-black mb-4">${data.stop.name}</h3>
            <p class="text-xl font-light text-black">
              Distance ${(data.distance_m/1000).toFixed(1)} km · ${(data.duration_s/60).toFixed(0)} min
            </p>
          </div>`;
        }

        async function handleFindBus(event) {
          event.preventDefault();
          const stopId = document.getElementById('stop-select').value;
          if (!stopId) return alert('Select a stop first');
          await showRoute(stopId);
        }

    </script>

  </body>
